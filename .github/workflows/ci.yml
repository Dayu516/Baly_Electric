name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  # ── Job 1: Static Guard（最快，無 DB）──────────────────
  static-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Import boundary lint (import-linter)
        run: lint-imports

      - name: Architecture tests
        run: python -m pytest tests/test_architecture.py -v

  # ── Job 2: Unit Tests（快，無 DB）──────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: static-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v
        env:
          PYTHONPATH: .

  # ── Job 3: Integration Tests（需 DB）───────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ottimo_test
          POSTGRES_USER: ottimo
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ottimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://ottimo:test@localhost:5432/ottimo_test

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://ottimo:test@localhost:5432/ottimo_test

  # ── Job 4: Migration Smoke（驗證 up/down/up）───────────
  migration-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ottimo_migrate
          POSTGRES_USER: ottimo
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ottimo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Migration up
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://ottimo:test@localhost:5432/ottimo_migrate

      - name: Migration down
        run: alembic downgrade base
        env:
          DATABASE_URL: postgresql://ottimo:test@localhost:5432/ottimo_migrate

      - name: Migration up again
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://ottimo:test@localhost:5432/ottimo_migrate
